<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kara AI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="topbar">
    <div id="time">00:00</div>
    <div>KARA SYSTEM ONLINE</div>
  </div>

  <div class="dashboard">
    <div class="panel">Weather: --</div>
    <div class="panel">Tasks: 0 Pending</div>
  </div>

  <div class="main">
    <div class="orb" id="orb"></div>
    <div id="status">IDLE</div>
    <div id="log"></div>
  </div>

  <div class="command-box">
    <input id="userInput" placeholder="Issue command..." />
    <button id="sendBtn">Run</button>
    <button id="micBtn">🎤</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
